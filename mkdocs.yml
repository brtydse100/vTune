site_name: vLLM Optimizer
site_description: Benchmark-driven configuration optimization for vLLM inference servers
site_url: https://brtydse100.github.io/vllm-optimizer/
repo_url: https://github.com/brtydse100/vllm-optimizer
repo_name: brtydse100/vllm-optimizer
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Overview: index.md
  - Get started:
      - Quick start: getting-started.md
      - Installation choices: installation.md
      - Configuration: configuration.md
      - YAML reference:
          - Overview: full-example.md
          - Server and tuning: full-example-server.md
          - Benchmarks and optimization: full-example-benchmark.md
          - Execution and logging: full-example-execution.md
          - vLLM Bench Serve: full-example-vllm-bench.md
      - Benchmarks:
          - Overview and vLLM Bench Serve: benchmarking.md
          - GuideLLM options: benchmark-guidellm.md
          - Datasets: benchmark-data.md
          - Repeats and errors: benchmark-repeats.md
      - Search and scoring: search-and-scoring.md
      - Parallel trials: parallel-trials.md
  - Backend comparison: backend-comparison.md
  - Release checklist: release-checklist.md
  - Use vLLM Optimizer:
      - CLI reference: cli.md
      - Reports: reports.md
      - Compatibility: compatibility.md
      - Troubleshooting: troubleshooting.md
      - Migration from vtune: migration-vllm-optimizer.md
  - Project:
      - Architecture: ARCHITECTURE.md
      - MVP specification:
          - Overview: MVP_SPEC.md
          - Configuration: mvp/configuration.md
          - Runtime and acceptance: mvp/runtime.md
      - Roadmap:
          - Overview: ROADMAP.md
          - Engine and benchmarks: roadmap/engine.md
          - Optimization: roadmap/optimization.md
          - Local execution: roadmap/local-execution.md
          - Distributed and reporting: roadmap/distributed.md
          - APIs, cost, and capacity: roadmap/integrations.md
          - Cross-cutting requirements: roadmap/requirements.md
      - Trust plan: TRUST_PLAN.md
      - Contributing: contributing.md
      - v0.1.0a13: releases/v0.1.0a13.md
      - v0.1.0a12: releases/v0.1.0a12.md
      - v0.1.0a11: releases/v0.1.0a11.md
      - v0.1.0a10: releases/v0.1.0a10.md
      - v0.1.0a9: releases/v0.1.0a9.md
      - v0.1.0a8: releases/v0.1.0a8.md
      - v0.1.0a7: releases/v0.1.0a7.md
      - v0.1.0a6: releases/v0.1.0a6.md
      - v0.1.0a5: releases/v0.1.0a5.md
      - v0.1.0a2: releases/v0.1.0a2.md
      - Changelog archive: releases/CHANGELOG_ARCHIVE.md
      - Release notes: https://github.com/brtydse100/vllm-optimizer/blob/main/CHANGELOG.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/brtydse100/vllm-optimizer
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/vllm-optimizer/

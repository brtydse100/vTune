site_name: vLLM Config Tuner
site_description: Benchmark-driven configuration tuning for vLLM inference servers
site_url: https://brtydse100.github.io/vllm-config-tuner/
repo_url: https://github.com/brtydse100/vllm-config-tuner
repo_name: brtydse100/vllm-config-tuner
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Overview: index.md
  - Get started:
      - Quick start: getting-started.md
      - Installation choices: installation.md
      - Configuration: configuration.md
      - Complete YAML: full-example.md
      - Benchmarks and datasets: benchmarking.md
      - Search and scoring: search-and-scoring.md
      - Parallel trials: parallel-trials.md
  - Backend comparison: backend-comparison.md
  - Release checklist: release-checklist.md
  - Use vLLM Config Tuner:
      - CLI reference: cli.md
      - Reports: reports.md
      - Compatibility: compatibility.md
      - Troubleshooting: troubleshooting.md
  - Project:
      - Architecture: ARCHITECTURE.md
      - MVP specification: MVP_SPEC.md
      - Roadmap: ROADMAP.md
      - Trust plan: TRUST_PLAN.md
      - Contributing: contributing.md
      - v0.1.0a9: releases/v0.1.0a9.md
      - v0.1.0a8: releases/v0.1.0a8.md
      - v0.1.0a7: releases/v0.1.0a7.md
      - v0.1.0a6: releases/v0.1.0a6.md
      - v0.1.0a5: releases/v0.1.0a5.md
      - v0.1.0a2: releases/v0.1.0a2.md
      - Changelog archive: releases/CHANGELOG_ARCHIVE.md
      - Release notes: https://github.com/brtydse100/vllm-config-tuner/blob/main/CHANGELOG.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/brtydse100/vllm-config-tuner
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/vtune/

site_name: vTune
site_description: Local-first experimentation and optimization for vLLM
site_url: https://brtydse100.github.io/vTune/
repo_url: https://github.com/brtydse100/vTune
repo_name: brtydse100/vTune
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Overview: index.md
  - Get started:
      - Quick start: getting-started.md
      - Configuration: configuration.md
      - Complete YAML: full-example.md
      - Benchmarks and datasets: benchmarking.md
      - Search and scoring: search-and-scoring.md
  - Use vTune:
      - CLI reference: cli.md
      - Reports: reports.md
      - Compatibility: compatibility.md
      - Troubleshooting: troubleshooting.md
  - Project:
      - Architecture: ARCHITECTURE.md
      - MVP specification: MVP_SPEC.md
      - Roadmap: ROADMAP.md
      - Contributing: contributing.md
      - v0.1.0a2 draft: releases/v0.1.0a2.md
      - Release notes: https://github.com/brtydse100/vTune/blob/main/CHANGELOG.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/brtydse100/vTune
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/vtune/

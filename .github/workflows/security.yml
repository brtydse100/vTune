name: Security and supply chain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit build
      - run: python -m pip install .
      - run: pip-audit
      - run: python -m build
      - run: git diff --exit-code -- . ':!*.egg-info/*'
      - run: pip install cyclonedx-bom
      - run: cyclonedx-py environment --output-format json --output-file sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-sbom
          path: sbom.json
          if-no-files-found: error
